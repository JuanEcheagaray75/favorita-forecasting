# General Properties
spark.master: local[8]
spark.driver.memory: 4g
spark.executor.memory: 8g
spark.driver.memoryOverhead: 1g
spark.executor.memoryOverhead: 1536m
spark.default.parallelism: 128
spark.memory.fraction: 0.5
spark.scheduler.mode: FAIR
spark.driver.maxResultSize: 4g

# SQL
spark.sql.execution.arrow.pyspark.enabled: true
spark.sql.cbo.enabled: true
spark.sql.adaptive.enabled: true
spark.sql.adaptive.coalescePartitions: true

# Spark UI
spark.ui.port: 4040
spark.ui.enabled: true
spark.port.maxRetries: 30

# Danger Zone
spark.executor.extraJavaOptions: "-XX:+UseG1GC,-XX:+UseCompressedOops"
spark.driver.extraJavaOptions: "-XX:+UseG1GC,-XX:+UseCompressedOops"
