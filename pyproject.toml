[project]
name = "favorita"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "kedro-viz>=10.1.0",
    "kedro>=0.19.9",
    "kedro-datasets>=5.1.0",
    "matplotlib>=3.9.2",
    "mlflow>=2.18.0",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "plotly>=5.24.1",
    "pyspark>=3.5.3",
    "xgboost>=2.1.2",
    "kedro-mlflow>=0.13.3",
    "hdfs>=2.7.3",
    "s3fs>=2024.10.0",
    "ipykernel>=6.29.5",
    "kaggle>=1.6.17",
    "py7zr>=0.22.0",
    "giskard>=2.7.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.14.1",
]


[tool.kedro]
package_name = "favorita"
project_name = "favorita"
kedro_init_version = "0.19.6"
tools = [
    'Linting',
    'Testing',
    'Custom Logging',
    'Documentation',
    'Data Structure',
    'PySpark',
    'Kedro Viz',
]
example_pipeline = "False"
source_dir = "src"

[tool.kedro_telemetry]
project_id = "7ee5315df23246c6ad3239f6198c47fd"
